# Measured controller stream: 1001 CRC-valid 64-byte SP frames in 5 seconds.
# Bytes 57..61 are opaque extension data; outgoing protocol is unchanged.
gimbal_rx_frame_bytes: 64

enemy_color: "red"
# enemy_color: "blue"


#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
yolov5n_model_path: assets/Infantry-v5n-Release-20260725.xml
yolov5_variant: yolov5n # original是原先的v5模型，yolov5n是2026深圳大学开源
device: GPU
min_confidence: 0.8
use_traditional: true

#####----- omnidirectional auxiliary cameras -----#####
# Fill in the exact HikRobot serial numbers printed on each camera/MVS device list.
# The role determines the mounting angle; never rely on SDK enumeration order.
camera_serial_number: "DA7447466"
omni_left_camera_serial_number: "DB0159681"
omni_right_camera_serial_number: "DB0159666"
omni_exposure_ms: 3
omni_gain: 5
omni_frame_rate: 60
omni_left_yaw_deg: 120.0
omni_right_yaw_deg: -120.0
# Optional per-camera measured calibration, relative to this YAML's directory.
# Empty keeps angle fallback. Never copy the main-camera intrinsics to auxiliary cameras.
omni_calibration_file: ""
# Effective FOV after crop/undistortion; calibrate these with the final lenses.
omni_horizontal_fov_deg: 44.98
omni_vertical_fov_deg: 34.50
omni_max_detection_age_ms: 120
omni_candidate_max_gap_ms: 120 # confirmation gap; independent from result age
omni_handoff_timeout_ms: 1500
omni_takeover_timeout_ms: 800
omni_failed_candidate_cooldown_ms: 500
omni_candidate_max_yaw_jump_deg: 10.0
omni_main_match_max_yaw_error_deg: 20.0
# While handing off, scan around the auxiliary target estimate instead of
# holding one potentially biased point forever.
omni_scan_amplitude_deg: 4.0
omni_scan_period_ms: 300
omni_scan_start_tolerance_deg: 6.0
omni_scan_settle_ms: 100

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

# #####-----USB相机参数-----#####
image_width: 640
image_height: 480
fov_h: 57.7
fov_v: 56.7
new_fov_h: 27
new_fov_v: 40.9
usb_frame_rate: 120
usb_exposure: 500
usb_gamma: 160
usb_gain: 10

#####-----工业相机参数-----#####
camera_name: "hikrobot"
exposure_ms: 3
gain: 8
vid_pid: "2bdf:0001"

#####-----传统方法参数-----#####
threshold: 150 #二值化阈值
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20 #同上长宽比
min_lightbar_length: 8 #最小长度
min_armor_ratio: 1 #小装甲板长宽比
max_armor_ratio: 5 #大装甲板长宽比
max_side_ratio: 1.5 #最大边长比
max_rectangular_error: 25 # 矩形度
min_confidence: 0.8

#####-----cboard参数-----#####
# Real-vehicle link. "sp" matches the packed q[4]/p[4] protocol in gimbal.hpp;
# use "cboard" only for the 0xA5 CAN-to-serial bridge.
control_transport: "sp"
# Bench-test interlock. Keep true until wheels are lifted and yaw directions,
# zero crossing, limits and emergency stop have all been checked.
real_vehicle_test_no_fire: true
# A p/q packet older than this is invalid and cannot drive an omni handoff.
imu_freshness_timeout_ms: 50
quaternion_canid: 0x01
# p[4]: big-yaw/chassis quaternion in wxyz order. If omitted, p falls back to q.
chassis_quaternion_canid: 0x02
bullet_speed_canid: 0x110
send_canid: 0xff
serial_port: "/dev/ttyUSB0"
serial_baud: 115200

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"

#####-----tracker参数-----#####
min_detect_count: 4 #最小连续识别帧数
max_temp_lost_count: 30 #最大临时丢失帧数
outpost_max_temp_lost_count: 75 #前哨最大临时丢失帧数

#####-----aimer参数-----#####
yaw_offset: 0.9 # degree 偏置 (原-0.6偏左,右移0.9)
pitch_offset: 3 # degree (原2偏高,降低1.2)
comming_angle: 47
leaving_angle: 16
left_yaw_offset: 1 
right_yaw_offset: 1
decision_speed: 1.5 # rad/s 决策速度阈值
high_speed_delay_time: 0.032
low_speed_delay_time: 0.03  # s
outpost_delay_time: 0.3 # s 前哨站延迟

#####-----shooter参数-----#####
first_tolerance: 2.2 # 近距离射击容差，degree
second_tolerance: 2.3 # 远距离射击容差，degree
judge_distance: 3 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

# #####-----planner-----#####
fire_thresh: 0.003

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

####----方差----####
v1: 200 #加速度方差
v2: 350 #角速度方差

#####-----decider参数-----#####
mode: 1

#####-----工业相机标定参数-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.0296px
camera_matrix: [1796.7051631424611, 0, 707.86139888664422, 0, 1794.8650483355925, 514.7564430977252, 0, 0, 1]
distort_coeffs: [-0.053935005818347745, 0.099523851213960096, -0.0023468801956506758, 6.48251983705048e-05, 0]

R_camera2gimbal: [0, 0, 1, -1, 0, 0, 0, -1, 0]
t_camera2gimbal: [0.11994017, 0.0, 0.16147]

#####-----buff参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.600 # s
predict_time: 0.154 # s (原0.125提前量不够，增大)
